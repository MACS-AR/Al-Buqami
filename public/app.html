<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المجد للأعلاف | إدارة مواقع العملاء</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        royal: {
                            dark: '#070A13',
                            card: '#131A2E',
                            accent: '#1C2642',
                            gold: '#D4AF37',
                            goldHover: '#B89028',
                            goldLight: '#F3E5AB'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }
        /* Animated Royal Background */
        .dark body {
            background: linear-gradient(-45deg, #070A13, #111827, #0A0F1D, #161F33);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #E2E8F0;
        }
        .light body {
            background: linear-gradient(-45deg, #F8FAFC, #F1F5F9, #E2E8F0, #CBD5E1);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #1E293B;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF099 0%, #D4AF37 50%, #997A15 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-border {
            border: 1px solid rgba(212, 175, 55, 0.35);
        }
        .gold-shadow {
            box-shadow: 0 4px 20px -2px rgba(212, 175, 55, 0.15);
        }
        .dark .glass-card {
            background: rgba(19, 26, 46, 0.85);
            backdrop-filter: blur(14px);
        }
        .light .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="p-3 md:p-6 pb-20">

    <!-- Header Section -->
    <header class="max-w-4xl mx-auto glass-card gold-border rounded-2xl p-4 mb-6 shadow-2xl flex items-center justify-between">
        <div class="flex items-center gap-3 md:gap-4">
            <!-- App Logo from GitHub Link -->
            <div class="w-14 h-14 md:w-16 md:h-16 rounded-xl gold-border overflow-hidden p-1 bg-black/50 flex justify-center items-center shadow-inner">
                <img id="appLogo" src="https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/javascript/javascript.png" alt="شعار المجد للأعلاف" class="object-cover w-full h-full rounded-lg">
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-black gold-gradient-text">المجد للأعلاف</h1>
                <p class="text-xs text-slate-400 font-semibold">إدارة وتتبع مواقع العملاء والسائقين</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Dark / Light Mode Toggle Button -->
            <button onclick="toggleTheme()" title="تغيير المظهر (داكن / فاتح)" class="bg-slate-800 dark:bg-slate-800 light:bg-slate-200 text-amber-400 w-10 h-10 rounded-xl flex items-center justify-center gold-border transition hover:scale-105">
                <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
            </button>
            <!-- Add Customer Button -->
            <button onclick="toggleAddModal()" class="bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-600 hover:to-yellow-700 text-slate-950 font-bold px-3.5 md:px-4 py-2.5 rounded-xl shadow-lg transition flex items-center gap-2 text-sm">
                <i class="fa-solid fa-user-plus text-base"></i>
                <span class="hidden sm:inline">إضافة عميل</span>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto">
        <!-- Search & Control Bar -->
        <div class="relative mb-6">
            <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-amber-400"></i>
            <input type="text" id="searchInput" oninput="filterCustomers()" placeholder="ابحث باسم العميل أو رقم التليفون..." 
                class="w-full dark:bg-slate-900/90 light:bg-white gold-border dark:text-white light:text-slate-900 text-sm rounded-xl py-3.5 pr-11 pl-4 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition placeholder-slate-400 shadow-inner">
        </div>

        <!-- Stats Bar -->
        <div class="flex justify-between items-center mb-4 px-2">
            <h2 class="text-lg font-bold dark:text-slate-200 light:text-slate-800">العملاء المسجلين (<span id="customerCount" class="text-amber-500 font-black">0</span>)</h2>
            <span class="text-xs text-emerald-500 font-semibold flex items-center gap-1.5 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">
                <i class="fa-solid fa-circle text-[8px] animate-pulse"></i> المتجر متصل بالسيرفر
            </span>
        </div>

        <!-- Customer List Container -->
        <div id="customerList" class="space-y-4">
            <!-- Loading State -->
            <div id="loadingState" class="text-center py-12 glass-card rounded-2xl gold-border">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-amber-500 mb-3"></i>
                <p class="dark:text-slate-400 light:text-slate-600 text-sm">جاري تحميل بيانات العملاء يا باشا...</p>
            </div>
        </div>
    </main>

    <!-- Modal Form (Add New Customer) -->
    <div id="addModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="glass-card gold-border rounded-2xl w-full max-w-lg p-6 relative shadow-2xl my-8">
            <button onclick="toggleAddModal()" class="absolute left-4 top-4 dark:text-slate-400 light:text-slate-600 hover:text-amber-500 text-lg transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-xl font-bold gold-gradient-text mb-4 border-b border-amber-500/20 pb-3 flex items-center gap-2">
                <i class="fa-solid fa-map-location-dot text-amber-500"></i>
                تسجيل مكان عميل جديد
            </h3>
            
            <form id="customerForm" onsubmit="saveCustomer(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold dark:text-slate-300 light:text-slate-700 mb-1">اسم العميل / المزرعة *</label>
                    <input type="text" id="custName" required placeholder="مثال: مزرعة الصفا للأعلاف" 
                        class="w-full dark:bg-slate-900/90 light:bg-white border dark:border-slate-700 light:border-slate-300 rounded-xl p-3 text-sm dark:text-white light:text-slate-900 focus:outline-none focus:border-amber-400">
                </div>

                <div>
                    <label class="block text-xs font-semibold dark:text-slate-300 light:text-slate-700 mb-1">رقم التليفون *</label>
                    <input type="tel" id="custPhone" required placeholder="010xxxxxxxx" 
                        class="w-full dark:bg-slate-900/90 light:bg-white border dark:border-slate-700 light:border-slate-300 rounded-xl p-3 text-sm dark:text-white light:text-slate-900 focus:outline-none focus:border-amber-400 text-right">
                </div>

                <div>
                    <label class="block text-xs font-semibold dark:text-slate-300 light:text-slate-700 mb-1">علامة مميزة أو ملاحظة (اختياري)</label>
                    <input type="text" id="custNotes" placeholder="مثال: بجوار المصنع القديم / الشارع اللي على اليمين" 
                        class="w-full dark:bg-slate-900/90 light:bg-white border dark:border-slate-700 light:border-slate-300 rounded-xl p-3 text-sm dark:text-white light:text-slate-900 focus:outline-none focus:border-amber-400">
                </div>

                <!-- Location Selector Mode Tabs -->
                <div class="pt-2">
                    <label class="block text-xs font-semibold text-amber-500 mb-2">طريقة تحديد مكان العميل *</label>
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <button type="button" id="tabAuto" onclick="switchLocationTab('auto')" 
                            class="py-2.5 px-3 text-xs font-bold rounded-lg border border-amber-500 bg-amber-500/20 text-amber-400 transition">
                            <i class="fa-solid fa-location-crosshairs ml-1"></i> مكان السائق الحالي (GPS)
                        </button>
                        <button type="button" id="tabManual" onclick="switchLocationTab('manual')" 
                            class="py-2.5 px-3 text-xs font-bold rounded-lg border dark:border-slate-700 light:border-slate-300 dark:bg-slate-800 light:bg-slate-100 dark:text-slate-400 light:text-slate-600 transition">
                            <i class="fa-solid fa-link ml-1"></i> حط رابط جوجل مابس
                        </button>
                    </div>

                    <!-- Auto GPS Section -->
                    <div id="secAuto" class="space-y-2">
                        <button type="button" onclick="getCurrentLocation()" id="locBtn"
                            class="w-full dark:bg-slate-800 light:bg-slate-100 hover:opacity-90 gold-border text-amber-500 font-semibold p-3.5 rounded-xl transition text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-street-view text-amber-500 text-base"></i>
                            <span id="locBtnText">دوس هنا عشان تجيب مكانك الحالي</span>
                        </button>
                    </div>

                    <!-- Manual Link Section -->
                    <div id="secManual" class="hidden space-y-2">
                        <label class="block text-[11px] dark:text-slate-400 light:text-slate-600 mb-1">انسخ رابط خرائط جوجل وحطه هنا:</label>
                        <input type="text" id="custMapUrl" oninput="parseMapUrl()" placeholder="مثال: https://maps.app.goo.gl/..." 
                            class="w-full dark:bg-slate-900/90 light:bg-white border dark:border-slate-700 light:border-slate-300 rounded-xl p-3 text-xs dark:text-white light:text-slate-900 focus:outline-none focus:border-amber-400">
                        <p class="text-[10px] text-amber-500/80">💡 افتح جوجل مابس عند العميل، اعمل مشاركة للمكان، وخد اللينك كوبي ولصقه هنا.</p>
                    </div>

                    <input type="hidden" id="custLat">
                    <input type="hidden" id="custLng">
                    <p id="locStatus" class="text-[11px] dark:text-slate-400 light:text-slate-600 mt-2 text-center font-semibold"></p>
                </div>

                <div class="pt-3 border-t dark:border-slate-800 light:border-slate-200">
                    <button type="submit" id="saveBtn" disabled
                        class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 disabled:opacity-40 disabled:cursor-not-allowed text-slate-950 font-bold p-3.5 rounded-xl shadow-lg transition text-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i>
                        احفظ بيانات العميل
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK v10 (Realtime Database Module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration الصحيحة بتاعت حضرتك
        const firebaseConfig = {
            apiKey: "AIzaSyBgRkceRq7FRbhCevLlULYNy-A5Tl_cr0w",
            authDomain: "sr-test-c9e06.firebaseapp.com",
            databaseURL: "https://sr-test-c9e06-default-rtdb.firebaseio.com",
            projectId: "sr-test-c9e06",
            storageBucket: "sr-test-c9e06.firebasestorage.app",
            messagingSenderId: "658396508062",
            appId: "1:658396508062:web:c56cd84f93daa2e176308f",
            measurementId: "G-3ZZV344NDK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const customersRef = ref(db, 'customers');

        let allCustomers = [];

        // Theme Toggle Function
        window.toggleTheme = () => {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                icon.className = "fa-solid fa-sun text-sm";
                localStorage.setItem('almagd_theme', 'light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                icon.className = "fa-solid fa-moon text-sm";
                localStorage.setItem('almagd_theme', 'dark');
            }
        };

        // Load Saved Theme
        if (localStorage.getItem('almagd_theme') === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.getElementById('themeIcon').className = "fa-solid fa-sun text-sm";
        }

        // Tab Switching Logic
        window.switchLocationTab = (type) => {
            const btnAuto = document.getElementById('tabAuto');
            const btnManual = document.getElementById('tabManual');
            const secAuto = document.getElementById('secAuto');
            const secManual = document.getElementById('secManual');
            const locStatus = document.getElementById('locStatus');
            const saveBtn = document.getElementById('saveBtn');

            document.getElementById('custLat').value = '';
            document.getElementById('custLng').value = '';
            locStatus.innerText = '';
            saveBtn.disabled = true;

            if (type === 'auto') {
                btnAuto.className = "py-2.5 px-3 text-xs font-bold rounded-lg border border-amber-500 bg-amber-500/20 text-amber-500 transition";
                btnManual.className = "py-2.5 px-3 text-xs font-bold rounded-lg border dark:border-slate-700 light:border-slate-300 dark:bg-slate-800 light:bg-slate-100 dark:text-slate-400 light:text-slate-600 transition";
                secAuto.classList.remove('hidden');
                secManual.classList.add('hidden');
            } else {
                btnManual.className = "py-2.5 px-3 text-xs font-bold rounded-lg border border-amber-500 bg-amber-500/20 text-amber-500 transition";
                btnAuto.className = "py-2.5 px-3 text-xs font-bold rounded-lg border dark:border-slate-700 light:border-slate-300 dark:bg-slate-800 light:bg-slate-100 dark:text-slate-400 light:text-slate-600 transition";
                secManual.classList.remove('hidden');
                secAuto.classList.add('hidden');
            }
        };

        // Modal Controls
        window.toggleAddModal = () => {
            const modal = document.getElementById('addModal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
            if(modal.classList.contains('hidden')) {
                document.getElementById('customerForm').reset();
                document.getElementById('saveBtn').disabled = true;
                document.getElementById('locStatus').innerText = '';
            }
        };

        // Auto GPS Capture
        window.getCurrentLocation = () => {
            const locBtnText = document.getElementById('locBtnText');
            const locStatus = document.getElementById('locStatus');
            const saveBtn = document.getElementById('saveBtn');

            if (!navigator.geolocation) {
                locStatus.innerText = "المتصفح بتاعك مش بيتدعم خاصية تحديد المكان.";
                return;
            }

            locBtnText.innerText = "جاري الاتصال بالأقمار الصناعية...";
            locStatus.innerText = "استنى ثواني، جاري لقط المكان...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    document.getElementById('custLat').value = lat;
                    document.getElementById('custLng').value = lng;

                    locBtnText.innerText = "تم لقط المكان بنجاح يا باشا ✓";
                    locStatus.innerText = `الإحداثيات جاهزة للحفظ (GPS)`;
                    locStatus.className = "text-[11px] text-emerald-500 mt-2 text-center font-bold";
                    saveBtn.disabled = false;
                },
                (error) => {
                    locBtnText.innerText = "جرّب تاني لقط المكان";
                    locStatus.innerText = "مش قادرين نحدد مكانك، تأكد إن الـ GPS مفتوح في التليفون.";
                    locStatus.className = "text-[11px] text-rose-500 mt-2 text-center";
                },
                { enableHighAccuracy: true, timeout: 15000 }
            );
        };

        // Parse Map URL
        window.parseMapUrl = () => {
            const url = document.getElementById('custMapUrl').value.trim();
            const locStatus = document.getElementById('locStatus');
            const saveBtn = document.getElementById('saveBtn');

            if (!url) {
                document.getElementById('custLat').value = '';
                document.getElementById('custLng').value = '';
                saveBtn.disabled = true;
                locStatus.innerText = '';
                return;
            }

            const match = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || url.match(/q=(-?\d+\.\d+),(-?\d+\.\d+)/) || url.match(/destination=(-?\d+\.\d+),(-?\d+\.\d+)/);
            
            if (match) {
                const lat = parseFloat(match[1]);
                const lng = parseFloat(match[2]);
                document.getElementById('custLat').value = lat;
                document.getElementById('custLng').value = lng;

                locStatus.innerText = `تم قراءة مكان العميل من اللينك بنجاح ✓`;
                locStatus.className = "text-[11px] text-emerald-500 mt-2 text-center font-bold";
                saveBtn.disabled = false;
            } else if (url.includes('goo.gl') || url.includes('maps.app.goo.gl') || url.includes('google.com/maps')) {
                document.getElementById('custLat').value = "link_mode";
                document.getElementById('custLng').value = url;
                locStatus.innerText = `تم قبول لينك المكان بنجاح ✓`;
                locStatus.className = "text-[11px] text-emerald-500 mt-2 text-center font-bold";
                saveBtn.disabled = false;
            } else {
                locStatus.innerText = "اللينك مش مظبوط، تأكد إنك ناسخه صح من خرائط جوجل.";
                locStatus.className = "text-[11px] text-amber-500 mt-2 text-center";
                saveBtn.disabled = true;
            }
        };

        // Save Customer to Realtime Database
        window.saveCustomer = async (e) => {
            e.preventDefault();
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const notes = document.getElementById('custNotes').value.trim();
            const latVal = document.getElementById('custLat').value;
            const lngVal = document.getElementById('custLng').value;

            if (!latVal || !lngVal) {
                alert('يا باشا لازم تحدد مكان العميل الأول سواء بالـ GPS أو باللينك');
                return;
            }

            let customerData = {
                name,
                phone,
                notes: notes || "مافيش ملاحظات",
                createdAt: Date.now()
            };

            if (latVal === "link_mode") {
                customerData.isCustomLink = true;
                customerData.mapUrl = lngVal;
            } else {
                customerData.isCustomLink = false;
                customerData.lat = parseFloat(latVal);
                customerData.lng = parseFloat(lngVal);
            }

            try {
                // حفظ البيانات بجد على السيرفر
                await push(customersRef, customerData);
                
                // تنظيف الفورمة وقفل النافذة خالص زي ما طلبت
                document.getElementById('customerForm').reset();
                document.getElementById('saveBtn').disabled = true;
                toggleAddModal();
            } catch (err) {
                alert('حصل مشكلة أثناء الحفظ على السيرفر: ' + err.message);
            }
        };

        // Delete Customer Function
        window.deleteCustomer = async (id, name) => {
            if (confirm(`متأكد يا باشا إنك عاوز تحذف العميل (${name}) نهائياً؟`)) {
                try {
                    await remove(ref(db, 'customers/' + id));
                } catch (err) {
                    alert('حصل مشكلة أثناء الحذف: ' + err.message);
                }
            }
        };

        // Realtime Database Listener (سحب البيانات فوراً أول بأول)
        onValue(customersRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                allCustomers = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                }));
                // ترتيب العملاء من الأحدث للأقدم
                allCustomers.sort((a, b) => b.createdAt - a.createdAt);
            } else {
                allCustomers = [];
            }
            renderCustomers(allCustomers);
        }, (err) => {
            console.error(err);
            document.getElementById('customerList').innerHTML = `
                <div class="text-center py-8 text-rose-500 glass-card rounded-2xl gold-border">
                    <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
                    <p class="text-sm font-bold">حصل خطأ في الاتصال بقاعدة بيانات السيرفر!</p>
                </div>`;
        });

        // Filter Function
        window.filterCustomers = () => {
            const queryVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allCustomers.filter(c => 
                c.name.toLowerCase().includes(queryVal) || 
                c.phone.includes(queryVal)
            );
            renderCustomers(filtered);
        };

        // Render Cards UI
        function renderCustomers(list) {
            const container = document.getElementById('customerList');
            document.getElementById('customerCount').innerText = list.length;

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 glass-card rounded-2xl gold-border">
                        <i class="fa-solid fa-users-slash text-4xl text-slate-500 mb-3"></i>
                        <p class="dark:text-slate-400 light:text-slate-600 text-sm">مافيش عملاء مسجلين بالاسم ده لحد دلوقتي.</p>
                    </div>`;
                return;
            }

            container.innerHTML = list.map(c => {
                let mapLink = c.isCustomLink ? c.mapUrl : `https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}`;
                return `
                <div class="glass-card gold-border rounded-2xl p-4 md:p-5 gold-shadow hover:border-amber-500 transition">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="font-bold text-lg md:text-xl dark:text-white light:text-slate-900 mb-1 flex items-center gap-2">
                                <i class="fa-solid fa-wheat-awn text-amber-500 text-sm"></i>
                                ${c.name}
                            </h3>
                            <a href="tel:${c.phone}" class="text-amber-500 text-sm font-semibold flex items-center gap-2 hover:underline w-fit">
                                <i class="fa-solid fa-phone text-xs"></i>
                                <span dir="ltr">${c.phone}</span>
                            </a>
                            ${c.notes && c.notes !== "مافيش ملاحظات" ? `<p class="text-xs dark:text-slate-400 light:text-slate-600 mt-1"><i class="fa-regular fa-note-sticky text-amber-500 ml-1"></i>${c.notes}</p>` : ''}
                        </div>
                        <button onclick="deleteCustomer('${c.id}', '${c.name}')" title="حذف العميل" 
                            class="text-slate-400 hover:text-rose-500 dark:bg-slate-800 light:bg-slate-100 hover:bg-rose-500/10 p-2.5 rounded-xl transition border dark:border-slate-700 light:border-slate-200">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>

                    <div class="flex gap-2.5 pt-3 border-t dark:border-slate-800 light:border-slate-200">
                        <a href="tel:${c.phone}" class="flex-1 dark:bg-slate-800 light:bg-slate-100 hover:opacity-80 dark:text-white light:text-slate-900 font-semibold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 border dark:border-slate-700 light:border-slate-200 transition">
                            <i class="fa-solid fa-phone-volume text-emerald-500"></i>
                            اتصال بـرقم التليفون
                        </a>
                        <a href="${mapLink}" target="_blank" class="flex-1 bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-600 hover:to-yellow-700 text-slate-950 font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 transition shadow-md">
                            <i class="fa-solid fa-location-arrow"></i>
                            افتح الخريطة والتنقل
                        </a>
                    </div>
                </div>
            `;
            }).join('');
        }
    </script>
</body>
</html>
