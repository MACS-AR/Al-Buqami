<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>دخول الإدارة - مؤسسة البقمي</title><link rel="stylesheet" href="assets/css/style.css"></head><body><section style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div class="glass-panel" style="width:100%;max-width:440px;padding:40px"><h2 style="color:var(--gold);margin-bottom:10px">دخول لوحة الإدارة</h2><p style="color:var(--text-muted);margin-bottom:25px">هذه الصفحة مخصصة لمسؤولي الموقع فقط.</p><form id="admin-form"><div class="form-group"><label>البريد الإلكتروني</label><input id="email" type="email" class="form-control" required></div><div class="form-group"><label>كلمة المرور</label><input id="password" type="password" class="form-control" required></div><button class="btn-gold" style="width:100%;justify-content:center">دخول الإدارة</button></form><a href="login.html" style="display:block;text-align:center;margin-top:20px;color:var(--gold)">دخول العملاء</a></div></section><script type="module">import{auth,signInWithEmailAndPassword,showToast}from'./assets/js/firebase.js';document.getElementById('admin-form').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,email.value.trim(),password.value);location.href='admin.html'}catch{showToast('بيانات دخول الإدارة غير صحيحة','error')}};</script></body></html>
