<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي - مؤسسة البقمي</title>
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>.account-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}.order-card{padding:22px;border:1px solid var(--glass-border);border-right:4px solid var(--gold);border-radius:12px;background:rgba(255,255,255,.03)}.order-products{color:var(--text-muted);line-height:1.9;margin:12px 0}.status{display:inline-block;padding:5px 12px;border-radius:6px;background:#e67e22;color:#fff;font-size:.85rem}</style>
</head>
<body>
<div id="loading-screen"><div class="spinner"></div></div>
<header><nav class="navbar"><div class="logo-container"><a href="index.html"><img src="https://raw.githubusercontent.com/MACS-AR/Al-Buqami/refs/heads/main/public/assets/logo1.png" alt="البقمي"></a></div><ul class="nav-links"><li><a href="index.html">الرئيسية</a></li><li><a href="products.html">المتجر الرقمي</a></li><li><a href="invoice.html">الفواتير</a></li></ul><div class="nav-actions"><button id="logout-btn" class="btn-outline">تسجيل الخروج</button><div class="menu-toggle"><i class="fa-solid fa-bars"></i></div></div></nav></header>
<main style="padding:120px 5% 60px;max-width:1200px;margin:auto;min-height:80vh"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:30px"><div><h1 class="section-title" style="margin-bottom:8px">حسابي <span>وطلباتي</span></h1><p id="account-email" style="color:var(--text-muted)"></p></div><a href="products.html" class="btn-gold"><i class="fa-solid fa-store"></i> متابعة التسوق</a></div><div class="glass-panel" style="padding:25px;margin-bottom:25px"><h2 style="color:var(--gold);margin-bottom:15px"><i class="fa-regular fa-user"></i> بيانات الحساب</h2><div class="account-grid"><p>الاسم: <strong id="account-name">--</strong></p><p>الجوال: <strong id="account-phone">--</strong></p><p>عدد الطلبات: <strong id="orders-count">0</strong></p></div></div><h2 style="color:var(--gold);margin:25px 0 15px">طلباتك وفواتيرك</h2><div id="orders-list" class="account-grid"><p>جاري تحميل الطلبات...</p></div></main>
<footer><div style="max-width:1200px;margin:auto;padding:20px 5%"><p>© 2026 مؤسسة مناحي البقمي التجارية</p></div></footer>
<script type="module">
import {auth,db,ref,get,child,onAuthStateChanged,showToast} from './assets/js/firebase.js';
import {addLogoutHandler} from './assets/js/app.js';
const byId=id=>document.getElementById(id); addLogoutHandler();
onAuthStateChanged(auth,async user=>{byId('loading-screen').style.display='none';if(!user){location.href='login.html?return=account';return}byId('account-email').textContent=user.email||'';try{const profile=await get(child(ref(db),`users/${user.uid}`));if(profile.exists()){const p=profile.val();byId('account-name').textContent=p.name||'--';byId('account-phone').textContent=p.phone||'--'}const snap=await get(child(ref(db),'orders'));const orders=snap.exists()?Object.values(snap.val()).filter(o=>o.userId===user.uid):[];byId('orders-count').textContent=orders.length;const list=byId('orders-list');list.innerHTML=orders.length?'':'<p class="glass-panel" style="padding:25px">لا توجد طلبات حتى الآن.</p>';orders.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0)).forEach(o=>{const card=document.createElement('article');card.className='order-card';const products=(o.products||[]).map(p=>`${p.name||'منتج'} × ${p.quantity||1}`).join('، ');const total=(o.products||[]).reduce((s,p)=>s+(Number(p.price)||0)*(Number(p.quantity)||1),0)*1.15;card.innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><strong>طلب ${o.orderId||'--'}</strong><span class="status">${o.status||'بانتظار الدفع'}</span></div><div class="order-products">${products||'لا توجد تفاصيل'}</div><p style="color:var(--gold);font-weight:700">الإجمالي: ${total.toFixed(2)} ر.س</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px"><a class="btn-gold" href="invoice.html?orderId=${encodeURIComponent(o.orderId)}">عرض وطباعة الفاتورة</a></div>`;list.appendChild(card)})}catch{showToast('تعذر تحميل بيانات الحساب','error')}});
</script></body></html>
