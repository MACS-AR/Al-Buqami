<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحساب - مؤسسة البقمي</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>.auth-switch{display:flex;gap:8px;margin-bottom:25px}.auth-switch button{flex:1}.hidden{display:none!important}</style>
</head>
<body>
<div id="loading-screen"><div class="spinner"></div></div>
<section style="min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px">
<div class="glass-panel" style="width:100%;max-width:480px;padding:40px;box-shadow:0 10px 40px #000b">
<div style="text-align:center;margin-bottom:25px"><img src="https://raw.githubusercontent.com/MACS-AR/Al-Buqami/refs/heads/main/public/assets/logo1.png" style="height:70px;margin-bottom:15px" alt="البقمي"><h2 id="form-title">تسجيل الدخول</h2><p style="color:var(--text-muted);font-size:.9rem">أنشئ حساباً لتتمكن من الشراء ومتابعة فواتيرك</p></div>
<div class="auth-switch"><button id="show-login" class="btn-gold">تسجيل الدخول</button><button id="show-register" class="btn-outline">حساب جديد</button></div>
<form id="login-form"><div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="login-email" class="form-control" required></div><div class="form-group" style="margin-bottom:25px"><label>كلمة المرور</label><input type="password" id="login-password" class="form-control" minlength="6" required></div><button class="btn-gold" style="width:100%;justify-content:center;padding:14px">دخول</button></form>
<form id="register-form" class="hidden"><div class="form-group"><label>الاسم الكامل</label><input type="text" id="register-name" class="form-control" required></div><div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="register-email" class="form-control" required></div><div class="form-group"><label>رقم الجوال</label><input type="tel" id="register-phone" class="form-control" required></div><div class="form-group" style="margin-bottom:25px"><label>كلمة المرور (6 أحرف على الأقل)</label><input type="password" id="register-password" class="form-control" minlength="6" required></div><button class="btn-gold" style="width:100%;justify-content:center;padding:14px">إنشاء الحساب</button></form>
<p id="admin-hint" style="text-align:center;margin-top:25px;color:var(--text-muted);font-size:.85rem">للدخول إلى لوحة الإدارة استخدم <a href="login.html?admin=1" style="color:var(--gold)">رابط الإدارة</a></p>
</div></section>
<script type="module">
import { auth, db, ref, set, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, showToast } from './assets/js/firebase.js';
const login=document.getElementById('login-form'), register=document.getElementById('register-form'), title=document.getElementById('form-title');
const toggle=(isLogin)=>{login.classList.toggle('hidden',!isLogin);register.classList.toggle('hidden',isLogin);title.textContent=isLogin?'تسجيل الدخول':'إنشاء حساب جديد';document.getElementById('show-login').className=isLogin?'btn-gold':'btn-outline';document.getElementById('show-register').className=isLogin?'btn-outline':'btn-gold'};
document.getElementById('show-login').onclick=()=>toggle(true); document.getElementById('show-register').onclick=()=>toggle(false);
onAuthStateChanged(auth,user=>{if(user && new URLSearchParams(location.search).get('admin')!=='1') location.href='products.html'; document.getElementById('loading-screen').style.display='none';});
login.onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,login['login-email'].value.trim(),login['login-password'].value);showToast('تم تسجيل الدخول بنجاح');setTimeout(()=>location.href=new URLSearchParams(location.search).get('admin')==='1'?'admin.html':'products.html',600)}catch{showToast('البريد الإلكتروني أو كلمة المرور غير صحيحة','error')}};
register.onsubmit=async e=>{e.preventDefault();try{const name=document.getElementById('register-name').value.trim(),phone=document.getElementById('register-phone').value.trim(),email=document.getElementById('register-email').value.trim();const credential=await createUserWithEmailAndPassword(auth,email,document.getElementById('register-password').value);await set(ref(db,`users/${credential.user.uid}`),{name,phone,email,createdAt:new Date().toISOString()});showToast('تم إنشاء حسابك بنجاح');setTimeout(()=>location.href='products.html',600)}catch(error){showToast(error.code==='auth/email-already-in-use'?'البريد الإلكتروني مستخدم بالفعل':'تعذر إنشاء الحساب، تأكد من البيانات','error')}};
</script></body></html>
